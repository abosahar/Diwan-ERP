name: Windows installer

# The Windows installer (deploy/windows) on real Windows, in Windows PowerShell 5.1 as on the offices'
# computers: its functions with Pester (tests/windows/*.Tests.ps1), then a full install with
# Diwan-Setup.bat from a folder with spaces, damage on purpose, a run again over it and the daily
# update (tests/windows/Test-FullInstall.ps1), in C:\Diwan and in D:\Diwan: another drive than the
# %TEMP% of the runner (C:). Runs when those files change, and by hand (Run workflow).

on:
  push:
    paths:
      - 'deploy/windows/**'
      - 'tests/windows/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'deploy/windows/**'
      - 'tests/windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

concurrency:
  # Throwaway branch: its own group, so this run does not cancel the one before it.
  group: windows-installer-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions:
    name: Installer functions (Pester, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Probe Move-Item of a folder from %TEMP% to another drive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "PSVersion $($PSVersionTable.PSVersion) BuildVersion $($PSVersionTable.BuildVersion) Edition $($PSVersionTable.PSEdition) CLR $($PSVersionTable.CLRVersion)"
          Write-Host "OS $([Environment]::OSVersion.VersionString); System.Management.Automation $((Get-Item ([PSObject].Assembly.Location)).VersionInfo.FileVersion)"
          Write-Host ".NET Framework release $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release); mscorlib $((Get-Item ([object].Assembly.Location)).VersionInfo.FileVersion)"
          Write-Host "TEMP $env:TEMP  TMP $env:TMP  GetTempPath $([IO.Path]::GetTempPath())  RUNNER_TEMP $env:RUNNER_TEMP"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { Write-Host "drive $($_.Root) free $([math]::Round($_.Free / 1GB)) GB" }
          function New-Probe($base) {
            $dir = Join-Path $base ('probe-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path "$dir\diwan-erp\public" | Out-Null
            Set-Content -Path "$dir\diwan-erp\VERSION" -Value '9.9.9'
            return "$dir\diwan-erp"
          }
          $source = New-Probe $env:TEMP
          $target = Join-Path (Split-Path -Parent (New-Probe $env:RUNNER_TEMP)) 'release'
          try { Move-Item $source $target -ErrorAction Stop; Write-Host "Move-Item folder $source -> $target : MOVED (target VERSION: $(Test-Path "$target\VERSION"), source left: $(Test-Path $source))" }
          catch { Write-Host "Move-Item folder $source -> $target : FAILED $($_.Exception.GetType().FullName) [$($_.FullyQualifiedErrorId)] $($_.Exception.Message)" }
          $source = New-Probe $env:TEMP
          $target = Join-Path (Split-Path -Parent (New-Probe $env:RUNNER_TEMP)) 'release'
          try { [IO.Directory]::Move($source, $target); Write-Host "[IO.Directory]::Move $source -> $target : MOVED" }
          catch { Write-Host "[IO.Directory]::Move $source -> $target : FAILED $($_.Exception.GetType().FullName) $($_.Exception.Message)" }
          $source = New-Probe $env:TEMP
          $target = Join-Path (Split-Path -Parent (New-Probe $env:RUNNER_TEMP)) 'release'
          try { (New-Object IO.DirectoryInfo $source).MoveTo($target); Write-Host "DirectoryInfo.MoveTo $source -> $target : MOVED" }
          catch { Write-Host "DirectoryInfo.MoveTo $source -> $target : FAILED $($_.Exception.GetType().FullName) $($_.Exception.Message)" }
      - name: Pester 5
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
      - name: Tests
        shell: powershell
        env:
          # A folder on another drive than %TEMP% (C:), for tests/windows/InstallDrive.Tests.ps1.
          DIWAN_TEST_OTHER_DRIVE: ${{ runner.temp }}
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/windows'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  install:
    name: Full install and a run again (${{ matrix.root }}, windows-2022)
    # Throwaway branch to confirm the failure on another drive: runs even when Pester fails.
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default folder, and DIWAN_DIR on another drive than %TEMP%.
          - root: 'D:\Diwan'
            name: d-diwan
    steps:
      - uses: actions/checkout@v4
      - name: Install, damage, run again, update, check
        shell: powershell
        run: .\tests\windows\Test-FullInstall.ps1 -ThrowawayWindows -Root '${{ matrix.root }}'
      - name: Logs of the installation
        if: always()
        shell: powershell
        run: |
          Get-ChildItem '${{ matrix.root }}\logs' -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "==== $($_.FullName)"
            Get-Content -LiteralPath $_.FullName -Tail 300
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-install-logs-${{ matrix.name }}
          path: |
            ${{ matrix.root }}\logs
            ${{ matrix.root }}\shared\storage\logs
          retention-days: 7
